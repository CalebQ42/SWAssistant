name: swassistant
description: Character sheet and dice app for the FFG Star Wars TTRPG

publish_to: "none"

version: 4.3.5+200

environment:
  sdk: ">=3.0.0-417.2.beta <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  intl: any
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  in_app_purchase: ^3.2.0
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2
  googleapis: ^13.2.0
  uuid: ^4.5.1
  flutter_dotenv: ^5.2.1
  darkstorm_common: ^2.0.2
  flutter_secure_storage: ^9.2.3
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - .darkstorm
