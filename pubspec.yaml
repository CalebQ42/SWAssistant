name: swassistant
description: Character sheet and dice app for the FFG Star Wars TTRPG

publish_to: 'none'

version: 4.3.1+196

environment:
  sdk: ">=3.0.0-417.2.beta <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  intl: any
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.6
  file_picker: ^8.0.3
  in_app_purchase: ^3.2.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  googleapis: ^13.1.0
  uuid: ^4.4.0
  flutter_dotenv: ^5.1.0
  darkstorm_common: ^1.0.13
  stupid: ^0.2.6
  flutter_secure_storage: ^9.2.1
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - .stupid
